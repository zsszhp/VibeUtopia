# VibeUtopia 智能模型切换配置
# 新增 provider 只需在此文件添加配置，并在 .env 中填入对应的 API key 即可

providers:
  longcat:
    name: "LongCat"
    base_url: "https://api.longcat.chat/openai/v1"
    api_key_env: "LONGCAT_API_KEY"
    models:
      - id: "LongCat-Flash-Thinking-2601"
        tier: advanced
      - id: "LongCat-Flash-Standard"
        tier: standard
      - id: "LongCat-Flash-Lite"
        tier: lite

  deepseek:
    name: "DeepSeek"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    models:
      - id: "deepseek-reasoner"
        tier: advanced
      - id: "deepseek-chat"
        tier: standard

  aliyun:
    name: "阿里通义"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "ALIYUN_API_KEY"
    models:
      - id: "qwen-max"
        tier: advanced
      - id: "qwen-plus"
        tier: standard
      - id: "qwen-turbo"
        tier: lite

  siliconflow:
    name: "硅基流动"
    base_url: "https://api.siliconflow.cn/v1"
    api_key_env: "SILICONFLOW_API_KEY"
    models:
      - id: "deepseek-ai/DeepSeek-R1"
        tier: advanced
      - id: "deepseek-ai/DeepSeek-V3"
        tier: standard

task_tier_mapping:
  risk_assessment: advanced
  persona_simulation: standard
  rewrite: lite
  default: standard

fallback_strategy:
  same_provider_same_tier: true
  same_provider_lower_tier: true
  cross_provider_same_tier: true
  cross_provider_lower_tier: true
