# 多模型路由配置文件
# 支持多厂商、多模型、多 Key 智能调度
# 任务类型映射：根据任务复杂度自动选择不同级别的模型

# ==================== 任务类型与模型级别映射 ====================
task_tier_mapping:
  # 高级任务：复杂推理、多模态理解、人生故事生成
  life_story_generation: advanced
  persona_simulation: advanced
  multimodal_analysis: advanced
  risk_assessment: advanced
  
  # 标准任务：常规风险评估、文案理解、平台模拟
  default: standard
  text_understanding: standard
  platform_simulation: standard
  
  # 轻量任务：简单分类、格式化输出
  rewrite: lite
  json_extraction: lite

# ==================== Fallback 策略 ====================
fallback_strategy:
  same_provider_same_tier: true       # 优先：同厂商同级别
  same_provider_lower_tier: true      # 次优：同厂商低级别
  cross_provider_same_tier: true      # 再次：跨厂商同级别
  cross_provider_lower_tier: true     # 最后：跨厂商低级别

# ==================== Provider 配置 ====================
providers:
  # --- 阿里通义千问 (支持多模态) ---
  aliyun:
    name: "阿里通义千问"
    api_key_env: "ALIYUN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    models:
      # Qwen-VL 多模态模型
      - id: "qwen-vl-max"
        tier: advanced
        vision: true
        text: true
      - id: "qwen-vl-plus"
        tier: standard
        vision: true
        text: true
      # Qwen 文本模型
      - id: "qwen-max"
        tier: advanced
        vision: false
        text: true
      - id: "qwen-plus"
        tier: standard
        vision: false
        text: true
      - id: "qwen-turbo"
        tier: lite
        vision: false
        text: true

  # --- SenseNova (豆包火山引擎) ---
  sensenova:
    name: "SenseNova"
    api_key_env: "SENSENOVA_API_KEY"
    base_url: "https://api.sensenova.cn/v1"
    models:
      # DeepSeek v4 flash (主力模型)
      - id: "deepseek-v4-flash"
        tier: advanced
        vision: false
        text: true
      - id: "deepseek-v4"
        tier: advanced
        vision: false
        text: true
      - id: "deepseek-v3"
        tier: standard
        vision: false
        text: true

  # --- DeepSeek (备用) ---
  deepseek:
    name: "DeepSeek"
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com/v1"
    models:
      # DeepSeek-VL 多模态
      - id: "deepseek-vl2"
        tier: advanced
        vision: true
        text: true
      # DeepSeek 文本模型
      - id: "deepseek-v4-flash"
        tier: advanced
        vision: false
        text: true
      - id: "deepseek-chat"
        tier: standard
        vision: false
        text: true
      - id: "deepseek-coder"
        tier: standard
        vision: false
        text: true

  # --- 硅基流动 (聚合模型) ---
  siliconflow:
    name: "硅基流动"
    api_key_env: "SILICONFLOW_API_KEY"
    base_url: "https://api.siliconflow.cn/v1"
    models:
      # 支持视觉的模型
      - id: "Qwen/Qwen2-VL-72B-Instruct"
        tier: advanced
        vision: true
        text: true
      - id: "deepseek-ai/DeepSeek-V3"
        tier: standard
        vision: false
        text: true
      - id: "deepseek-ai/DeepSeek-R1"
        tier: advanced
        vision: false
        text: true

  # --- LongCat (快捷接入) ---
  longcat:
    name: "LongCat"
    api_key_env: "LONGCAT_API_KEY"
    base_url: "https://api.longcat.chat/openai/v1"
    models:
      - id: "LongCat-Flash-Omni-2603"
        tier: advanced
        vision: true
        text: false  # Omni 是纯视觉模型，不支持纯文本任务，仅用于多模态分析
      - id: "LongCat-Flash-Thinking-2601"
        tier: advanced
        vision: false
        text: true
      - id: "LongCat-Flash-Chat"
        tier: standard
        vision: false
        text: true
      - id: "LongCat-VL"
        tier: standard
        vision: true
        text: true

  # --- 商汤 SenseNova (DeepSeek V4 Flash) ---
  sensenova:
    name: "商汤 SenseNova"
    api_key_env: "SENSENOVA_API_KEY"
    base_url: "https://token.sensenova.cn/v1"
    models:
      - id: "deepseek-v4-flash"
        tier: advanced
        vision: false
        text: true

  # --- Ollama (笔记本本地 RTX 5070 Ti 12GB VRAM) ---
  # 视频理解VLM模型方案 (2026.5 更新)
  # 主力: Qwen3-VL-8B (256K上下文, 2h视频, 秒级时间戳, 32语言OCR)
  # 备选: MiniCPM-o-2.6 (GPT-4o级多模态, 端侧优化, 实时视频流)
  ollama:
    name: "Ollama (笔记本本地)"
    api_key_env: "OLLAMA_API_KEY"
    base_url: "http://localhost:11434/v1"
    models:
      # 视觉主力: Qwen3-VL-8B (Q4 ~6.5GB VRAM) - 2026最佳本地VLM
      - id: "qwen3-vl:8b"
        tier: advanced
        vision: true
        text: true
        priority: 1
      # 视觉备选: MiniCPM-o-2.6 (Q4 ~7GB VRAM) - 端侧优化, 实时视频流
      - id: "openbmb/minicpm-o2.6"
        tier: standard
        vision: true
        text: true
        priority: 2
      # 文本主力: Qwen3-8B (Q4 ~5GB VRAM)
      - id: "qwen3:8b"
        tier: advanced
        vision: false
        text: true
        priority: 3

  # --- vLLM (本地高性能推理，V3.2) ---
  vllm:
    name: "vLLM (本地高性能推理)"
    api_key_env: "VLLM_API_KEY"
    base_url: "http://localhost:8000/v1"
    models: []
    # vLLM 模型通过运行时 API 动态发现，无需预配置
    # 启动后会自动从 http://localhost:8000/v1/models 获取可用模型

  # --- Agnes AI (图像生成 + 文本) ---
  agnes:
    name: "Agnes AI"
    api_key_env: "AGNES_API_KEY"
    base_url: "https://apihub.agnes-ai.com/v1"
    models:
      # 图像生成模型
      - id: "agnes-image-2.1-flash"
        tier: advanced
        vision: false
        text: false
        image_gen: true
        image_mode: "t2i"  # 纯文生图
      - id: "agnes-image-2.0-flash"
        tier: standard
        vision: false
        text: false
        image_gen: true
        image_mode: "img2img"  # 图生图/图片编辑/多图合成
      # 文本模型
      - id: "agnes-2.0-flash"
        tier: standard
        vision: false
        text: true

  # --- 阿里 Paraformer (音频转写专用) ---
  paraformer:
    name: "阿里 Paraformer"
    api_key_env: "ALIYUN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/api/v1/services/asr/transcription"
    models:
      - id: "paraformer-v2"
        tier: standard
        vision: false
        text: false
        audio: true

# ==================== 模型路由默认设置 ====================
default:
  provider: "aliyun"  # 默认厂商
  tier: "standard"    # 默认级别
  
# ==================== 硬件检测配置 ====================
hardware_detection:
  enabled: true
  vram_thresholds:
    # VRAM < 8GB: 使用轻量模型
    lite: 8
    # VRAM >= 8GB and < 16GB: 使用标准模型
    standard: 16
    # VRAM >= 16GB: 可使用高级模型
    advanced: 999
