version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vibeutopia-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: vibe_root_password
      MYSQL_DATABASE: vibeutopia
      MYSQL_USER: vibe_user
      MYSQL_PASSWORD: vibe_password
    volumes:
      - /var/lib/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: vibeutopia-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/vibeutopia2024
    volumes:
      - /var/lib/neo4j:/data
