[pytest]
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = video logs large_scale_test_results scripts __pycache__
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    integration: tests that need external services (ChromaDB/MySQL/Neo4j)
    requires_api: tests that need a real LLM API key
    slow: long-running tests
