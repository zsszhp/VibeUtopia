# VibeUtopia 智能模型切换配置
# 新增 provider 只需在此文件添加配置，并在 .env 中填入对应的 API key 即可

providers:
  longcat:
    name: "LongCat"
    base_url: "https://api.longcat.chat/openai/v1"
    api_key_env: "LONGCAT_API_KEY"
    models:
      - id: "LongCat-Flash-Omni-2603"
        tier: advanced
        vision: true
        text: false
        priority: 1  # 最高优先级（多模态任务首选）
      - id: "LongCat-Flash-Thinking-2601"
        tier: advanced
        priority: 2  # 第二优先级（复杂推理任务）
      - id: "LongCat-Flash-Chat"
        tier: standard
        priority: 3  # 第三优先级（快速对话任务）
      - id: "LongCat-Flash-Lite"
        tier: standard
        priority: 4  # 最低优先级

  deepseek:
    name: "DeepSeek"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    models:
      - id: "deepseek-reasoner"
        tier: advanced
      - id: "deepseek-chat"
        tier: standard

  aliyun:
    name: "阿里通义"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "ALIYUN_API_KEY"
    models:
      - id: "qwen-max"
        tier: advanced
      - id: "qwen-plus"
        tier: standard
      - id: "qwen-turbo"
        tier: lite
      - id: "qwen-vl-plus"
        tier: advanced
        vision: true
      - id: "qwen-vl-max"
        tier: advanced
        vision: true

  siliconflow:
    name: "硅基流动"
    base_url: "https://api.siliconflow.cn/v1"
    api_key_env: "SILICONFLOW_API_KEY"
    models:
      - id: "deepseek-ai/DeepSeek-R1"
        tier: advanced
      - id: "deepseek-ai/DeepSeek-V3"
        tier: standard
      - id: "Qwen/Qwen2.5-VL-72B-Instruct"
        tier: advanced
        vision: true

  # --- Agnes AI (图像生成 + 文本) ---
  agnes:
    name: "Agnes AI"
    api_key_env: "AGNES_API_KEY"
    base_url: "https://apihub.agnes-ai.com/v1"
    models:
      - id: "agnes-image-2.1-flash"
        tier: advanced
        vision: false
        text: false
        image_gen: true
        image_mode: "t2i"
      - id: "agnes-image-2.0-flash"
        tier: standard
        vision: false
        text: false
        image_gen: true
        image_mode: "img2img"
      - id: "agnes-2.0-flash"
        tier: standard
        vision: false
        text: true

  zhipu:
    name: "智谱AI"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key_env: "GLM_API_KEY"
    models:
      - id: "glm-4-plus"
        tier: advanced
      - id: "glm-4-flash"
        tier: standard
      - id: "glm-4v-plus"
        tier: advanced
        vision: true
      - id: "glm-4v-flash"
        tier: standard
        vision: true

task_tier_mapping:
  risk_assessment: advanced
  persona_simulation: standard
  transcript_detection: standard
  persona_generation: standard
  life_story_generation: advanced
  memory_reflection: standard
  agent_simulation: standard
  rewrite: standard
  ocr: advanced
  visual_risk: advanced
  cross_modal: standard
  default: standard

fallback_strategy:
  same_provider_same_tier: true
  same_provider_lower_tier: true
  cross_provider_same_tier: true
  cross_provider_lower_tier: true
